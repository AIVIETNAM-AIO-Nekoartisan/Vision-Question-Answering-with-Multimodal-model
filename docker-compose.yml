# Data stores only. The backend is NOT containerised: it needs the GPU, and
# CUDA-in-Docker buys nothing when there is exactly one host with one GPU.
#
# Volumes point at /mnt/data (ext4), not the Lexar drive (exFAT): Elasticsearch
# needs POSIX ownership and Lucene needs file locking, neither of which exFAT
# provides. Videos and keyframes stay on Lexar because those are plain reads.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vqa-qdrant
    ports:
      - "6333:6333"
    volumes:
      - /mnt/data/vqa-stores/qdrant:/qdrant/storage
    restart: unless-stopped

  elasticsearch:
    # 8.17.0 because that tag is already in the local image cache and the
    # registry CDN is unreachable from this network. Still 8.x, so the
    # elasticsearch>=8,<9 client pin holds.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: vqa-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - /mnt/data/vqa-stores/es:/usr/share/elasticsearch/data
    restart: unless-stopped
